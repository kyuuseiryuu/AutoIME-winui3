; ==============================================================================
; AutoIME Configuration Example / 配置文件示例 / 設定例
; Encoding: UTF-16 LE / UTF-8
; ==============================================================================

[Settings]
; 0: Disable ToolTip notifications / 关闭悬浮提示
; 1: Enable ToolTip notifications / 开启悬浮提示
DebugMode=0

; Interface Language / 界面语言 / UI言語: "zh" | "en" | "ja"
Language=zh

; Activation Hotkey / 唤醒快捷键 / 起動ショートカットキー
; AutoHotkey format: ^ = Ctrl, ! = Alt, + = Shift, # = Win
Hotkey=^!i

